# Couchmate server. Start with:  docker compose up -d
# Then open http://<this computer>:8787/admin, create the admin password, set a PIN code and switch on plugins.
services:
  couchmate:
    build: .
    image: couchmate
    container_name: couchmate
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Settings, plugins, favourites, history, reminders and translations – kept between restarts.
      - couchmate-data:/data
      # Temporary files, e.g. the movie that is playing (shared download). Needs room for a whole movie.
      - couchmate-cache:/cache

volumes:
  couchmate-data:
  couchmate-cache:
