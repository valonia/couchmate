<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Couchmates</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23122046'/%3E%3Crect x='8' y='7' width='16' height='11' rx='3' fill='%233d7bff'/%3E%3Crect x='4' y='14' width='6' height='12' rx='2.5' fill='%232f63d6'/%3E%3Crect x='22' y='14' width='6' height='12' rx='2.5' fill='%232f63d6'/%3E%3Crect x='9' y='18' width='14' height='6' rx='2' fill='%235b92ff'/%3E%3Cpath d='M14 9.5v6l5-3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Inloggning -->
  <section id="login" hidden>
    <div class="login-box">
      <h1><span class="brand-b">Couch</span><span class="brand-a">mates</span></h1>
      <p class="muted">Titta tillsammans. Alla som är anslutna ser samma sak samtidigt.</p>
      <form id="login-form" autocomplete="on">
        <label>PIN-kod<input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN från servern"></label>
        <label>Ditt namn<input id="login-name" type="text" autocomplete="nickname" placeholder="Visas för de andra" required></label>
        <button type="submit" class="btn primary">Anslut</button>
        <p id="login-error" class="error"></p>
      </form>
      <div id="login-lang" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px"></div>
    </div>
  </section>

  <!-- Bläddra -->
  <section id="browse" hidden>
    <header id="topbar"></header>
    <main id="main"></main>
  </section>

  <!-- Spelare -->
  <section id="player" hidden>
    <video id="video" playsinline></video>
    <div id="player-ui"></div>
  </section>

  <script src="/vendor/mpegts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
